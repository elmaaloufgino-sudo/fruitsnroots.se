<!DOCTYPE html>
<html lang="sv-SE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruitsnroots | Frystorkade Frukter, Sea Moss & Nötter</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Fredoka:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Snipcart CSS för varukorgen -->
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.css" />

    <style>
        /* ==========================================
           1. GLOBAL RESET & VARIABLER
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --primary-dark: #1b4332;
            --primary-green: #2d6a4f;
            --accent-gold: #ffb703;
            --bg-light-green: #f4f9f5;
            --text-dark: #2b2b2b;
            --text-muted: #555555;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.06);
            --hover-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        /* --- SKRÄDDARSYDD SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-light-green);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-green);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        section, div[id], footer[id] {
            scroll-margin-top: 90px;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)), url('./1784729911178.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, .hero-content p, .package-item h4 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 400;
        }

        /* --- ELEGANT UNDERLINES FÖR RUBRIKER --- */
        h1, h2, h3, h4, .elegant-heading {
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--accent-gold);
        }

        .elegant-heading {
            font-family: 'Dancing Script', cursive !important;
            font-weight: 600 !important;
            letter-spacing: 0.8px;
        }

        /* ==========================================
           2. HEADER & LOGOTYP
           ========================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            background: rgba(27, 67, 50, 0.96);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .logo img {
            width: 38px;
            height: 38px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .logo-text, .logo-text span {
            font-family: 'Dancing Script', cursive !important;
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            white-space: nowrap;
            /* --- ELEGANT UNDERLINE FÖR LOGOTYP --- */
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--accent-gold);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.4rem;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .cart-btn:hover {
            transform: scale(1.1);
        }

        .snipcart-items-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent-gold);
            color: var(--primary-dark);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 50%;
            font-family: 'Poppins', sans-serif;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .hamburger-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .hamburger-btn span {
            display: block;
            width: 26px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 3px;
            transition: 0.3s;
        }

        /* ==========================================
           3. DRAWER MENY
           ========================================== */
        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 35, 25, 0.55);
            z-index: 1000;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .drawer-menu {
            position: fixed;
            top: 0; right: -300px;
            width: 260px; height: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #f4f9f5 100%);
            z-index: 1001;
            box-shadow: -10px 0 40px rgba(0,0,0,0.22);
            transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 1.5rem 1.2rem;
            border-top-left-radius: 24px; border-bottom-left-radius: 24px;
            border-left: 3px solid var(--accent-gold);
        }

        .drawer-menu.open { right: 0; }

        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(45, 106, 79, 0.12);
            padding-bottom: 0.8rem; margin-bottom: 0.8rem;
        }

        .drawer-title {
            font-family: 'Dancing Script', cursive !important;
            font-size: 2rem; font-weight: 700; color: var(--primary-dark);
            text-decoration: none; /* Keep drawer title clean */
        }

        .close-drawer {
            width: 32px; height: 32px; border-radius: 50%;
            background-color: #f0f4f1; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--primary-dark); cursor: pointer; transition: all 0.25s ease;
        }

        .close-drawer:hover {
            background-color: var(--primary-dark); color: #ffffff; transform: rotate(90deg);
        }

        .drawer-nav { display: flex; flex-direction: column; gap: 0.35rem; }
        .drawer-nav a {
            text-decoration: none; color: #2c3e35; font-weight: 500; font-size: 0.98rem;
            padding: 0.55rem 0.9rem; border-radius: 10px; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: space-between;
        }
        .drawer-nav a .arrow { font-size: 0.8rem; opacity: 0.4; transition: transform 0.2s ease, opacity 0.2s ease; }
        .drawer-nav a:hover {
            color: var(--primary-dark); background-color: rgba(45, 106, 79, 0.08); transform: translateX(-3px); font-weight: 600;
        }
        .drawer-nav a:hover .arrow { opacity: 1; transform: translateX(3px); color: var(--primary-green); }

        .drawer-nav .cta-btn {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-dark) 100%);
            color: #ffffff !important; text-align: center; border-radius: 10px;
            padding: 0.65rem; margin-top: 0.6rem; font-weight: 600; justify-content: center;
        }
        .drawer-nav .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(45, 106, 79, 0.3); }

        .drawer-footer { border-top: 1px solid rgba(45, 106, 79, 0.12); padding-top: 0.8rem; text-align: center; }
        .drawer-footer span { font-family: 'Dancing Script', cursive !important; color: var(--accent-gold); font-size: 1.2rem; font-weight: bold; }

        /* ==========================================
           4. HERO SEKTION
           ========================================== */
        .hero {
            position: relative; height: 38vh; min-height: 260px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            color: white; padding: 0 1rem; overflow: hidden; background-color: var(--primary-dark);
            border-bottom: 3px solid var(--accent-gold);
        }
        @keyframes heroZoom { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('./1784410818535.png') no-repeat center center;
            background-size: cover; z-index: 1; animation: heroZoom 7s ease-in-out infinite;
        }
        .hero-content { position: relative; z-index: 2; }
        .hero-content p {
            font-size: 1.3rem; margin-bottom: 1.5rem; max-width: 680px; margin-left: auto; margin-right: auto;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8); font-weight: 400; letter-spacing: 0.3px;
        }

        /* --- ANIMERAD PIL I HERO --- */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 1.5rem;
            animation: bounce 2s infinite;
            z-index: 3;
            opacity: 0.8;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-15px) translateX(-50%); }
            60% { transform: translateY(-7px) translateX(-50%); }
        }

        /* ==========================================
           5. KNAPPAR
           ========================================== */
        .btn {
            display: inline-block; background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-dark) 100%);
            color: white; padding: 0.8rem 1.8rem; border-radius: 30px; text-decoration: none; font-weight: 500;
            cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(45, 106, 79, 0.35); transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45, 106, 79, 0.5);
            background: linear-gradient(135deg, #388465 0%, #22543d 100%);
        }
        .btn-outline {
            background: var(--primary-green); border: 1.5px solid var(--primary-green);
            color: #ffffff !important; margin-top: 1rem; display: inline-block; text-align: center;
            border-radius: 25px; padding: 0.5rem 1.1rem; font-weight: 500; font-size: 0.82rem;
            box-shadow: 0 3px 10px rgba(45, 106, 79, 0.22); transition: all 0.25s ease; cursor: pointer;
        }
        .btn-outline:hover {
            background: var(--primary-dark); border-color: var(--primary-dark); color: var(--accent-gold) !important;
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(27, 67, 50, 0.32);
        }

        /* ==========================================
           6. OM OSS SEKTION
           ========================================== */
        .about-intro-section { padding: 2.5rem 5% 1rem 5%; text-align: center; }
        .about-intro-container {
            max-width: 850px; margin: 0 auto; background: var(--glass-bg); backdrop-filter: blur(10px);
            padding: 2rem 2.5rem; border-radius: 20px; box-shadow: var(--card-shadow);
            border: 1px solid var(--glass-border); border-left: 5px solid var(--primary-green); text-align: left;
        }
        .about-intro-section h2 { font-size: 2.2rem; color: var(--primary-dark); margin-bottom: 0.8rem; text-align: center; }
        .about-intro-section p { color: var(--text-dark); font-size: 0.95rem; line-height: 1.65; margin-bottom: 0.8rem; font-weight: 300; }

        /* ==========================================
           7. PRODUKTER & LAYOUT
           ========================================== */
        .products-section {
            padding: 3.5rem 5%; text-align: center; background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px); margin: 2rem 0; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .alt-bg { background-color: rgba(240, 244, 239, 0.75); }
        .products-section h2 { font-size: 2rem; font-weight: 500; margin-bottom: 1.5rem; color: var(--primary-dark); cursor: pointer; }
        .products-section h2:hover { color: var(--primary-green); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1100px; margin: 0 auto; }
        
        .product-card {
            background: rgba(255, 255, 255, 0.96); border-radius: 20px; overflow: hidden;
            box-shadow: var(--card-shadow); border: 1px solid var(--glass-border); text-align: left;
            cursor: pointer; transition: transform 0.35s, box-shadow 0.35s; display: flex; flex-direction: column; height: 100%;
            position: relative;
        }
        .product-card:hover { transform: translateY(-8px); box-shadow: var(--hover-shadow); }
        .product-card img { width: 100%; height: 240px; object-fit: cover; transition: transform 0.6s ease; }
        .product-card:hover img { transform: scale(1.07); }
        .card-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
        .product-card h3 { margin-bottom: 0.4rem; color: var(--primary-green); font-size: 1.15rem; font-weight: 500; }
        .product-card p { color: var(--text-muted); font-size: 0.88rem; font-weight: 300; margin-bottom: 1rem; flex-grow: 1; }

        /* --- FLYTANDE ETIKETT (BÄSTSÄLJARE) --- */
        .card-badge {
            position: absolute;
            top: 15px;
            right: -10px;
            background: var(--accent-gold);
            color: var(--primary-dark);
            padding: 5px 15px;
            border-radius: 20px 0 0 20px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .content-layout { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; max-width: 1300px; margin: 2rem auto; padding: 0 5%; }
        .main-content { min-width: 0; }
        .sidebar-column { display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-widget {
            background: var(--glass-bg); backdrop-filter: blur(8px); padding: 1.6rem;
            border-radius: 20px; box-shadow: var(--card-shadow); border-left: 4px solid var(--primary-green);
        }
        .sidebar-widget h3 { color: var(--primary-dark); margin-bottom: 0.8rem; font-size: 1.15rem; font-weight: 500; }
        .sidebar-widget p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.55; font-weight: 300; }

        /* ==========================================
           8. SOCIALA MEDIER
           ========================================== */
        .social-media-section {
            padding: 2rem 5%; text-align: center; max-width: 1300px; margin: 0 auto 2rem auto;
        }
        .social-media-container {
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 3rem 2rem; border-radius: 20px;
            box-shadow: var(--card-shadow); border: 1px solid var(--glass-border); border-top: 4px solid var(--primary-green);
        }
        .social-media-container h2 { font-size: 2.2rem; color: var(--primary-dark); margin-bottom: 0.5rem; }
        .social-media-container p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; font-weight: 300; }
        .social-links-wrapper { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
        .social-card {
            display: flex; align-items: center; gap: 10px; padding: 1rem 2rem; background: #ffffff;
            border: 1.5px solid #e0e0e0; border-radius: 15px; text-decoration: none; color: var(--primary-dark);
            font-weight: 500; font-size: 1.1rem; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .social-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); border-color: var(--primary-green); }
        .social-card.instagram:hover { color: #E1306C; border-color: #E1306C; }
        .social-card.tiktok:hover { color: #000000; border-color: #000000; }
        .social-card.facebook:hover { color: #1877F2; border-color: #1877F2; }

        /* ==========================================
           9. NYHETSBREV & FOOTER
           ========================================== */
        .newsletter-section {
            background: var(--glass-bg); backdrop-filter: blur(10px); max-width: 850px; margin: 1rem auto;
            padding: 2.5rem 2rem; border-radius: 20px; box-shadow: var(--card-shadow); text-align: center;
            border-top: 4px solid var(--accent-gold);
        }
        .newsletter-form { display: flex; gap: 12px; justify-content: center; max-width: 520px; margin: 0 auto; flex-wrap: wrap; }
        .newsletter-form input[type="email"] {
            flex: 1; min-width: 250px; padding: 0.8rem 1.2rem; border: 1.5px solid #e0e0e0;
            border-radius: 30px; font-size: 0.92rem; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
        
        .contact-footer-wrapper {
            background: linear-gradient(180deg, var(--primary-dark) 0%, #0d2818 100%); color: white;
            margin-top: 4rem; padding: 4rem 5% 2rem 5%; border-top: 4px solid var(--accent-gold);
        }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-bottom: 3.5rem; }
        .contact-info-card, .contact-form-card { padding: 2.2rem; border-radius: 20px; }
        .contact-info-card { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); }
        .contact-form-card { background: rgba(255, 255, 255, 0.97); color: var(--text-dark); }
        
        .contact-detail-item { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 1.5rem; }
        .contact-detail-item .icon-box {
            background: rgba(255, 183, 3, 0.15); color: var(--accent-gold); width: 40px; height: 40px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
        }

        /* ==========================================
           10. MODAL
           ========================================== */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.65); backdrop-filter: blur(6px); overflow-y: auto; padding: 20px 10px;
        }
        .modal-content {
            background-color: #ffffff; margin: 4% auto; padding: 2rem; border-radius: 20px; max-width: 900px;
            width: 95%; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        .close-btn { position: absolute; right: 1.5rem; top: 1rem; font-size: 2rem; color: #888; cursor: pointer; }
    </style>
